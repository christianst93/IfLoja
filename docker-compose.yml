services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/bd.sql:/docker-entrypoint-initdb.d/01-bd.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "5055:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: loja
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
